<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — MakeYourWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{
      --bg:#060912;--bg2:#080d1a;
      --acc:#6c63ff;--acc2:#ff6584;--acc3:#43e97b;
      --glass:rgba(255,255,255,.035);
      --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
      --text:#e8eaf6;--muted:#6b7394;
      --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
      --r:16px;--r2:24px;--ease:cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--bg);color:var(--text);
      font-family:var(--fb);font-weight:300;
      min-height:100vh;display:flex;
      align-items:center;justify-content:center;
      overflow:hidden;position:relative;
    }

    /* BG orbs */
    .orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
    .o1{width:600px;height:600px;background:radial-gradient(circle,rgba(108,99,255,.15),transparent 65%);top:-20%;left:-15%;}
    .o2{width:500px;height:500px;background:radial-gradient(circle,rgba(255,101,132,.1),transparent 65%);bottom:-20%;right:-10%;}
    .o3{width:350px;height:350px;background:radial-gradient(circle,rgba(67,233,123,.07),transparent 65%);top:50%;left:55%;}

    /* Grid noise texture */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:50px 50px;z-index:0;pointer-events:none;
    }

    .login-wrap{
      position:relative;z-index:1;
      width:100%;max-width:420px;
      padding:1rem;
    }

    /* Logo */
    .adm-logo{
      text-align:center;margin-bottom:2.5rem;
    }
    .adm-logo a{
      font-family:var(--fh);font-size:1.4rem;font-weight:800;
      letter-spacing:-.02em;color:var(--text);text-decoration:none;
    }
    .adm-logo a span{color:var(--acc);}
    .adm-logo a em{font-style:normal;color:var(--acc2);font-size:.9em;}
    .adm-badge{
      display:inline-flex;align-items:center;gap:.4rem;
      font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
      color:var(--muted);background:rgba(255,255,255,.05);
      border:1px solid var(--border);padding:.3rem .9rem;
      border-radius:100px;margin-top:.6rem;
    }
    .adm-badge i{color:var(--acc3);font-size:.55rem;}

    /* Card */
    .login-card{
      background:rgba(255,255,255,.03);
      border:1px solid var(--border2);
      border-radius:var(--r2);
      padding:2.5rem 2rem;
      backdrop-filter:blur(20px);
      box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(108,99,255,.08);
    }
    .login-card h1{
      font-family:var(--fh);font-size:1.5rem;font-weight:800;
      margin-bottom:.35rem;
    }
    .login-card p{font-size:.88rem;color:var(--muted);margin-bottom:2rem;}

    /* Form */
    .lf-group{margin-bottom:1.25rem;display:flex;flex-direction:column;gap:.4rem;}
    .lf-group label{
      font-size:.72rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.1em;color:var(--muted);
    }
    .lf-input-wrap{position:relative;}
    .lf-input-wrap i{
      position:absolute;left:1rem;top:50%;transform:translateY(-50%);
      color:var(--muted);font-size:.85rem;pointer-events:none;
    }
    .lf-input-wrap input{
      width:100%;background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:var(--r);
      padding:.85rem 1rem .85rem 2.75rem;
      color:var(--text);font-family:var(--fb);font-size:.93rem;
      outline:none;transition:border-color .25s,box-shadow .25s,background .25s;
      -webkit-appearance:none;
    }
    .lf-input-wrap input:focus{
      border-color:rgba(108,99,255,.55);
      box-shadow:0 0 0 3px rgba(108,99,255,.1);
      background:rgba(108,99,255,.03);
    }
    .lf-input-wrap input::placeholder{color:rgba(107,115,148,.4);}

    /* Toggle password */
    .pwd-toggle{
      position:absolute;right:1rem;top:50%;transform:translateY(-50%);
      background:none;border:none;color:var(--muted);cursor:pointer;
      font-size:.85rem;padding:.2rem;
      transition:color .2s;
    }
    .pwd-toggle:hover{color:var(--text);}

    /* Error */
    .lf-error{
      display:none;background:rgba(255,101,132,.08);
      border:1px solid rgba(255,101,132,.3);color:var(--acc2);
      padding:.75rem 1rem;border-radius:var(--r);
      font-size:.85rem;margin-bottom:1.2rem;
      align-items:center;gap:.6rem;
    }
    .lf-error.show{display:flex;}

    /* Submit */
    .btn-login{
      width:100%;padding:.95rem;border-radius:100px;
      background:linear-gradient(135deg,#6c63ff,#a855f7);
      color:#fff;font-family:var(--fb);font-size:.97rem;font-weight:500;
      border:none;cursor:pointer;
      box-shadow:0 8px 32px rgba(108,99,255,.4);
      transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,opacity .2s;
      display:flex;align-items:center;justify-content:center;gap:.6rem;
      position:relative;overflow:hidden;
    }
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(108,99,255,.55);}
    .btn-login:active{transform:scale(.98);}
    .btn-login.loading{opacity:.7;pointer-events:none;}
    .btn-login .spin{display:none;animation:spin .7s linear infinite;}
    .btn-login.loading .spin{display:inline-block;}
    .btn-login.loading .btn-text{display:none;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Back link */
    .back-link{
      text-align:center;margin-top:1.5rem;
      font-size:.82rem;color:var(--muted);
    }
    .back-link a{
      color:var(--acc);transition:opacity .2s;
      text-decoration:none;font-weight:500;
    }
    .back-link a:hover{opacity:.75;}

    @media(max-width:480px){
      .login-card{padding:2rem 1.5rem;}
    }
  </style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>

  <div class="login-wrap">
    <div class="adm-logo">
      <a href="../index.html">make<span>your</span>web<em>.xyz</em></a><br/>
      <span class="adm-badge"><i class="fas fa-circle"></i> Admin Panel</span>
    </div>

    <div class="login-card">
      <h1>Welcome back 👋</h1>
      <p>Sign in to manage your portfolio &amp; demos.</p>

      <div class="lf-error" id="lfError">
        <i class="fas fa-exclamation-circle"></i>
        <span id="lfErrorMsg">Incorrect password. Try again.</span>
      </div>

      <div class="lf-group">
        <label for="adminPass">Password</label>
        <div class="lf-input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPass" placeholder="Enter admin password" autocomplete="current-password"/>
          <button class="pwd-toggle" type="button" id="pwdToggle" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="pwdIcon"></i>
          </button>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" type="button">
        <i class="fas fa-spinner spin"></i>
        <span class="btn-text"><i class="fas fa-arrow-right-to-bracket"></i>&nbsp; Sign In</span>
      </button>

      <div class="back-link">
        <a href="../index.html"><i class="fas fa-arrow-left" style="font-size:.75rem"></i> Back to website</a>
      </div>
    </div>
  </div>

  <script>
    // ── CONFIG ──
    // Change this password to whatever you want!
    const ADMIN_PASSWORD = 'makeyourweb2025';
    const SESSION_KEY    = 'myw_admin_auth';

    // If already logged in, go straight to dashboard
    if (sessionStorage.getItem(SESSION_KEY) === 'true') {
      window.location.href = 'dashboard.html';
    }

    const btn      = document.getElementById('loginBtn');
    const input    = document.getElementById('adminPass');
    const errBox   = document.getElementById('lfError');
    const errMsg   = document.getElementById('lfErrorMsg');
    const pwdToggle= document.getElementById('pwdToggle');
    const pwdIcon  = document.getElementById('pwdIcon');

    // Toggle password visibility
    pwdToggle.addEventListener('click', () => {
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      pwdIcon.className = isText ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // Login
    function doLogin() {
      errBox.classList.remove('show');
      const val = input.value.trim();

      if (!val) {
        errMsg.textContent = 'Please enter your password.';
        errBox.classList.add('show');
        input.focus();
        return;
      }

      btn.classList.add('loading');

      setTimeout(() => {
        if (val === ADMIN_PASSWORD) {
          sessionStorage.setItem(SESSION_KEY, 'true');
          window.location.href = 'dashboard.html';
        } else {
          btn.classList.remove('loading');
          errMsg.textContent = 'Incorrect password. Please try again.';
          errBox.classList.add('show');
          input.value = '';
          input.focus();
          // Shake animation
          input.style.animation = 'none';
          input.offsetHeight; // reflow
          input.style.animation = 'shake .4s ease';
        }
      }, 700);
    }

    btn.addEventListener('click', doLogin);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // Shake keyframe
    const style = document.createElement('style');
    style.textContent = '@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}';
    document.head.appendChild(style);
  </script>
</body>
</html>
